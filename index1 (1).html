<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NYR PIXEL STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1445;--panel:#2a1f66;--ink:#f6f2ff;--muted:#b9b0e6;--pink:#ff5c8a;--gold:#ffd166;--cyan:#4de1d2;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.7;
background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px}
.px{font-family:"Press Start 2P","Courier New",monospace;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;max-width:1000px;margin:auto}
.brand{display:flex;align-items:center;gap:12px;direction:ltr}
.slot{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;border:3px dashed var(--muted);background:rgba(0,0,0,.2);overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain}
.logo-company{width:64px;height:64px}
.brand b{font-size:12px}
main{max-width:1000px;margin:auto;padding:24px 20px 60px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;margin-top:16px}
.game-logo{width:100%;aspect-ratio:8/5;max-width:460px;margin-inline:auto;filter:drop-shadow(0 0 24px rgba(77,225,210,.35))}
h1{font-size:clamp(18px,4vw,30px);margin:0 0 14px;color:var(--gold)}
p{margin:0 0 22px;color:var(--muted);font-size:18px;max-width:34ch}
.cta{display:inline-block;border:0;cursor:pointer;font-family:"Press Start 2P","Courier New",monospace;font-size:14px;color:#1c1445;background:var(--pink);
padding:18px 24px;box-shadow:0 6px 0 #b8325c;transition:transform .08s,box-shadow .08s}
.cta:hover{background:#ff7aa0}
.cta:active{transform:translateY(5px);box-shadow:0 1px 0 #b8325c}
.cta:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.cta small{display:block;font-family:"Cairo",sans-serif;font-size:14px;font-weight:700;margin-top:6px}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
dialog{border:3px solid var(--cyan);background:var(--panel);color:var(--ink);padding:24px;max-width:340px;font-family:"Cairo",sans-serif;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog button{margin-top:12px;font:inherit;font-weight:700;padding:8px 20px;cursor:pointer;background:var(--cyan);border:0;color:#1c1445}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}p{margin-inline:auto}header{padding-top:12px}}
@media(prefers-reduced-motion:reduce){.cta{transition:none}}

header{direction:ltr}
.lang{font-family:"Cairo",sans-serif;font-weight:900;font-size:15px;color:var(--ink);background:transparent;border:3px solid var(--cyan);padding:6px 16px;cursor:pointer}
.lang:hover{background:rgba(77,225,210,.18)}
.lang:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
dialog{width:min(92vw,400px);text-align:start}
dialog h2{margin:0 0 8px;font-size:13px;color:var(--gold)}
.note{font-size:13px;color:var(--cyan);margin:0 0 14px;max-width:none;line-height:1.6}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:16px;padding:10px;background:#160f38;color:var(--ink);border:2px solid var(--muted);direction:ltr;text-align:start}
input:focus{outline:3px solid var(--cyan);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#ff8fa8;font-size:14px;min-height:22px;margin:8px 0 0}
.acts{display:flex;gap:10px;margin-top:10px}
.acts button{flex:1;margin:0;font:inherit;font-weight:900;padding:12px;cursor:pointer;border:0}
.pay{background:var(--pink);color:#1c1445}.cancel{background:transparent!important;color:var(--ink);border:2px solid var(--muted)!important}
.ok{text-align:center}.ok p{color:var(--ink);margin:10px auto}
.hide{display:none}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 16px;max-width:1000px;margin:0 auto}
.tabs a{font-weight:900;font-size:15px;color:var(--ink);text-decoration:none;padding:8px 16px;border:3px solid transparent}
.tabs a:hover{border-color:var(--muted)}.tabs a.on{border-color:var(--pink);background:rgba(255,92,138,.15)}
.tabs a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.card{background:var(--panel);border:3px solid var(--muted);padding:20px;margin-bottom:20px}
.card h3{margin:0 0 4px;font-size:20px;color:var(--gold)}
.role{color:var(--cyan)!important;font-size:14px!important;font-weight:700;margin:0 0 10px!important}
.card p{max-width:none;font-size:17px;margin:0}
.founder{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.founder img{width:100%;aspect-ratio:3/4;object-fit:cover;border:4px solid var(--pink);box-shadow:6px 6px 0 var(--cyan)}
.sec-t{font-size:16px;color:var(--gold);margin:8px 0 18px}
.price{font-size:28px!important;color:var(--gold)!important;margin:0 0 12px!important}
@media(max-width:700px){.founder{grid-template-columns:1fr}.founder img{max-width:240px;margin-inline:auto}}
.vid{display:flex;align-items:center;gap:16px;color:var(--ink);text-decoration:none}
.vid:hover{border-color:var(--pink)}.vid:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.vid h3{font-size:17px}.vid small{color:var(--muted);font-size:14px}
.play{flex:none;width:64px;height:64px;background:var(--pink);display:grid;place-items:center;box-shadow:4px 4px 0 var(--cyan)}
.play::before{content:"";border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #1c1445}
.tag{display:inline-block;font-size:10px;color:#1c1445;background:var(--gold);padding:6px 8px;margin-bottom:10px}
.cta:disabled,.cta:disabled:hover{opacity:.55;cursor:not-allowed;background:#8a80c0;box-shadow:0 6px 0 #4a4080;transform:none}
</style>
</head>
